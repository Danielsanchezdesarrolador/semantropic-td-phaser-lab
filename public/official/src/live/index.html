<!doctype html><html lang="es"><head><meta charset="utf-8">

<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#102f3a;color:#f2e4bd;font-family:system-ui,sans-serif}
#app{position:relative;width:100vw;height:100dvh;overflow:hidden}#stage{position:absolute;inset:0;overflow:hidden}

.panel{background:#102d3cec;border:1px solid #c6b687;border-radius:9px;padding:6px 9px}
.panel strong{font-size:13px}.panel small{display:block;color:#c9d8cb;font-size:11px}.panel b{color:#ffe29c}
.controls{display:flex;align-items:center;gap:4px;justify-content:flex-end;flex-wrap:wrap;pointer-events:auto;max-width:75vw}
button,select{background:#1d5261ee;border:1px solid #e8c88e;color:#fff1cb;font:700 12px system-ui;padding:6px 8px;border-radius:7px;min-height:42px}
button:disabled{opacity:.4;cursor:not-allowed}#feedback{font-size:11px;max-width:26vw}#installed{font-size:10px}
#results[hidden]{display:none!important}
#results{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
 background:#0d2735b8;backdrop-filter:blur(3px);padding:max(12px,env(safe-area-inset-left))}
#results article{width:min(480px,94vw);max-height:88dvh;overflow:auto;background:#183a43f5;color:#f6ebce;

#results h2{font-size:clamp(20px,4vw,28px);margin:4px 0 6px}
#resultStars{font-size:clamp(27px,6vw,40px);letter-spacing:.05em;color:#ffe18a;margin:10px 0}
#resultDetail{font-size:14px;line-height:1.5}
#resultSaved{display:block;font-size:11px;color:#c7d6ce;margin:12px 0}
#resultRestart{font-size:15px;min-height:46px}
#rally{pointer-events:auto;position:relative;z-index:6;min-height:32px;padding:3px 7px;margin-top:3px;font-size:11px}

 header{top:max(3px,env(safe-area-inset-top))}

 header .panel:first-child{max-width:60vw}
 .panel strong{font-size:11px}
 .panel small,#installed{font-size:10px}
 footer{align-items:flex-end;bottom:max(3px,env(safe-area-inset-bottom));gap:2px}
 .controls{width:100%;max-width:none;flex-wrap:nowrap;justify-content:flex-end;gap:2px}
 .controls button,.controls select{font-size:10px;line-height:1.05;min-height:44px;max-height:48px;
   padding:4px 5px;white-space:nowrap;flex-shrink:1}
 #prev,#next{min-width:36px;padding:4px 1px}
 #family{width:105px;max-width:120px;min-width:85px}

 #feedback{position:absolute;bottom:49px;left:0;max-width:52vw;font-size:10px;line-height:1.2}
}
@media(max-width:950px) and (orientation:portrait){#portrait{display:flex}}
