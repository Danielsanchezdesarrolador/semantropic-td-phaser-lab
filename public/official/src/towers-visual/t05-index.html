:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#133340;color:#f8edc8;font:13px system-ui,sans-serif}
#app{width:100vw;height:100dvh;position:relative;overflow:hidden}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}

button{font:700 11px system-ui;white-space:nowrap;border:1px solid #dec38e;color:#fff1d3;background:#234d5c;border-radius:7px;min-height:39px;padding:5px 8px;cursor:pointer;touch-action:manipulation}

#towerTitle{position:absolute;bottom:100px;left:0;right:0;z-index:4;text-align:center;color:#f9de9e;font-weight:700;font-size:14px;pointer-events:none}
