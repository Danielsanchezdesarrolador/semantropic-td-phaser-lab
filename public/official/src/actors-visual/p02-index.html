<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SEMANTROPIC TD · Equipo P / P-02 · Estudio de personajes</title>
<meta name="theme-color" content="#173b43">
<style>
:root{color-scheme:dark;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:#102a36;color:#eee5c8;font:700 12px system-ui,sans-serif}
#app{position:relative;width:100vw;height:100dvh;overflow:hidden}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#stage canvas{display:block;touch-action:none;max-width:100%;max-height:100%}
#top{position:absolute;left:calc(7px + var(--sl));right:calc(7px + var(--sr));top:calc(5px + var(--st));z-index:20;
display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none}
.group{display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;pointer-events:auto}
button{border:1px solid #c2aa7b;border-radius:7px;min-height:35px;padding:4px 9px;background:#173e4aec;color:#fff0d3;
font:700 11px system-ui;cursor:pointer;touch-action:manipulation}
button.active{background:#e6c17d;color:#15363d}
button:focus-visible{outline:2px solid #9ce7d4;outline-offset:2px}
#footer{position:absolute;bottom:calc(6px + var(--sb));left:calc(8px + var(--sl));right:calc(8px + var(--sr));z-index:25;
display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:7px;pointer-events:none}
#footer>*{pointer-events:auto}
#status{border:1px solid #77b4a5aa;background:#112f40eb;padding:6px 10px;border-radius:7px;font-size:10px}
#notice{color:#d6dec9;background:#102f3deb;border:1px solid #71949491;border-radius:6px;padding:5px 8px;font-size:10px}
#portrait{display:none;position:absolute;inset:0;z-index:50;align-items:center;justify-content:center;text-align:center;
background:#102d37;color:#e7cd9f;padding:25px;font-size:20px}
@media(orientation:portrait) and (max-width:880px){#portrait{display:flex}}
@media(orientation:landscape) and (max-height:525px){
 #top{gap:2px;top:calc(1px + var(--st))}
 button{min-height:29px;padding:3px 6px;font-size:9px}
 #status,#notice{padding:3px 5px;font-size:8px}
 #footer{bottom:calc(1px + var(--sb));gap:3px}
}
</style></head><body>
<main id="app">
 <div id="stage" aria-label="Phaser comparativa visual P01, P02 A y P02 B"></div>
 <div id="top">
  <nav class="group" aria-label="Seleccionar actor">
   <button data-actor="warrior" class="active">Orco Guerrero</button>
   <button data-actor="hound">Perro de Caza</button>
   <button data-actor="infantry_recruit">Soldado Recluta</button>
   <button data-actor="sniper_operator">Operador Francotirador</button>
  </nav>
  <div class="group" aria-label="Estado de animación">
   <button data-state="idle">Idle</button>
   <button data-state="walk" class="active">Walk</button>
   <button data-state="attackWindup">Anticipar</button>
   <button data-state="attack">Attack</button>
   <button data-state="hit">Hit</button>
   <button data-state="blocked">Blocked</button>
   <button data-state="die">Die</button>
  </div>
  <div class="group">
   <button id="facing">Dirección: E</button>
   <button id="pause">Ⅱ Pausar</button>
   <button id="anchors">Anclajes: OFF</button>
   <button id="zoom">Escala: detalle 2×</button>
  </div>
 </div>
 <div id="footer">
  <button id="exportA">Exportar PNG A</button>
  <button id="exportB">Exportar PNG B</button>
  <span id="status" role="status">Iniciando estudio visual P-02…</span>
  <span id="notice">ART PROTOTIPO · SIN IA/COMBATE/ECONOMÍA · escala pendiente de Dirección</span>
 </div>
 <div id="portrait">↻ Gira el dispositivo a horizontal para visualizar las animaciones.</div>
</main>
<script src="../../../dependencias/phaser.min.js"></script>
<script type="module" src="./p02-gallery.mjs"></script>
</body></html>
