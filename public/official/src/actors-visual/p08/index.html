<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SEMANTROPIC TD · P08 PERSONAJES · Galería de combate</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#183338;color:#f5e6c4;font:600 12px system-ui}
#app{position:relative;width:100vw;height:100dvh;overflow:hidden}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#stage canvas{display:block;max-width:100%;max-height:100%;touch-action:none}
#control{position:absolute;z-index:2;top:calc(env(safe-area-inset-top) + 5px);left:5px;right:5px;display:flex;justify-content:center;flex-wrap:wrap;gap:4px}
button{background:#254a56ed;color:#f0eac8;border:1px solid #89b9af;border-radius:7px;padding:7px 9px;min-height:34px;font-size:11px;font-weight:700;touch-action:manipulation;cursor:pointer}
button[aria-pressed="true"]{background:#eed2a1;color:#183338}
#note{position:absolute;left:5px;right:5px;bottom:calc(env(safe-area-inset-bottom) + 7px);margin:auto;width:fit-content;max-width:97%;background:#17323fdc;border:1px solid #749a9e;border-radius:9px;padding:7px;font-size:11px;text-align:center;z-index:2}
#rotate{display:none;position:absolute;inset:0;background:#1d3f45;z-index:10;text-align:center;place-content:center;padding:25px;font-size:20px}
@media(max-width:850px) and (orientation:portrait){#rotate{display:grid}}
@media(max-height:450px) and (orientation:landscape){#control button{min-height:25px;padding:3px 5px;font-size:9px}#note{font-size:9px;padding:3px}}
</style></head><body><main id="app">
<div id="stage" role="img" aria-label="Galería P08; un recluta y dos veteranos, orco y hound en poses de combate"></div>
<nav id="control">
<button data-state="idle">Reposo</button><button data-state="walk">Marcha</button>
<button data-state="attackWindup">Anticipo</button><button data-state="attack" aria-pressed="true">Ataque</button>
<button data-state="hit">Impacto</button><button data-state="blocked">Bloqueo</button>
<button data-state="die">Caída</button>
<button id="pause">Ⅱ Pausa</button><button id="step">Cuadro +1</button>
<button id="size">Altura mundo</button><button id="guides">Anclas OFF</button>
</nav>
<div id="note">P08 · spritesheets PNG reales · 1 recluta visual y 2 veteranos visuales · sin gameplay ni daño</div>
<div id="rotate">Gira el teléfono horizontalmente para revisar los actores en escala de juego.</div>
</main><script src="../../../../dependencias/phaser.min.js"></script>
<script type="module" src="./gallery.mjs"></script></body></html>
