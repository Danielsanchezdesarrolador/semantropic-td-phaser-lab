<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#193943">
<title>SEMANTROPIC TD · P05 Reactividad de Personajes</title>
<style>
:root{color-scheme:dark;--t:env(safe-area-inset-top,0px);--b:env(safe-area-inset-bottom,0px);--l:env(safe-area-inset-left,0px);--r:env(safe-area-inset-right,0px)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{font:700 12px system-ui,sans-serif;color:#eee1be;background:#122c36}
#app{position:relative;width:100vw;height:100dvh;overflow:hidden}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#stage canvas{max-width:100%;max-height:100%;touch-action:none}
#tools{position:absolute;z-index:12;top:calc(6px + var(--t));left:calc(5px + var(--l));right:calc(5px + var(--r));display:flex;flex-direction:column;align-items:center;gap:5px;pointer-events:none}
.group{display:flex;gap:5px;justify-content:center;align-items:center;flex-wrap:wrap;pointer-events:auto}
button{cursor:pointer;touch-action:manipulation;background:#214651f0;border:1px solid #a7b8a4;border-radius:8px;color:#fae9c5;min-height:36px;padding:5px 9px;font:700 11px system-ui}
button.active{background:#e9c68d;color:#203b46}
button:focus-visible{outline:2px solid #b2f1dc;outline-offset:1px}
#bottom{position:absolute;z-index:14;left:calc(5px + var(--l));right:calc(5px + var(--r));bottom:calc(5px + var(--b));display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
#bottom>*{pointer-events:auto}
#message,#runtime{border:1px solid #729b98;background:#112d3cdb;border-radius:7px;padding:4px 8px;text-align:center;max-width:95vw;font-size:10px}
#runtime{font-size:9px}
#portrait{display:none;position:absolute;z-index:20;inset:0;background:#112d37;padding:30px;align-items:center;justify-content:center;font-size:20px;text-align:center}
@media(max-width:850px) and (orientation:portrait){#portrait{display:flex}}
@media(max-height:475px) and (orientation:landscape){
 #tools{gap:2px;top:calc(1px + var(--t))}
 button{min-height:27px;padding:2px 5px;font-size:9px}
 #bottom{bottom:calc(1px + var(--b));gap:2px}
 #runtime{display:none}#message{font-size:8px;padding:2px 5px}
}
</style></head><body><main id="app">
<div id="stage" aria-label="Comparador P04/P05 de cuatro actores Phaser WebGL2"></div>
<div id="tools">
 <div class="group" aria-label="Personaje">
  <button data-actor="warrior" class="active">Orco Guerrero</button>
  <button data-actor="hound">Perro de Caza</button>
  <button data-actor="infantry_recruit">Recluta</button>
  <button data-actor="sniper_operator">Francotirador</button>
 </div>
 <div class="group" aria-label="Evento de muestra">
  <button data-event="move_state">Caminar</button>
  <button data-event="attack_windup">Anticipar</button>
  <button data-event="attack_fire">Atacar</button>
  <button data-event="hit_applied">Impacto</button>
  <button data-event="blocked">Bloqueo</button>
  <button data-event="entity_die">Eliminación visual</button>
  <button data-event="entity_escape">Fuga visual</button>
 </div>
 <div class="group">
  <button id="pause">Ⅱ Pausa</button><button id="reset">Reiniciar demo</button>
  <button id="direction">Orientación E</button><button id="speed">Ritmo 1×</button>
  <button id="guides">Pivotes OFF</button><button id="crowd">24 copias OFF</button>
 </div>
</div>
<div id="bottom">
 <div class="group"><button id="png">PNG atlas P05</button><button id="sheet">Hoja 6 poses P05</button></div>
 <div id="message" role="status">Preparando modelos visuales…</div>
 <div id="runtime">Muestra visual: sin daño, HP, compras, oro, spawns core ni recompensa.</div>
</div>
<div id="portrait">↻ Gira el dispositivo a horizontal para comparar las reacciones de combate.</div>
</main>
<script src="../../../dependencias/phaser.min.js"></script>
<script type="module" src="./p05-gallery.mjs"></script>
</body></html>
