<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14353c">
<title>SEMANTROPIC TD · P03 Q2 · Personajes Phaser WebGL2</title>
<style>
:root{color-scheme:dark;--st:env(safe-area-inset-top,0px);--sr:env(safe-area-inset-right,0px);--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{font:700 12px system-ui,sans-serif;background:#102b34;color:#f4e7c6}
#app{width:100vw;height:100dvh;position:relative;overflow:hidden}
#stage{position:absolute;inset:0;display:flex;justify-content:center;align-items:center}
#stage canvas{max-width:100%;max-height:100%;display:block;touch-action:none}
#tools{position:absolute;z-index:10;top:calc(5px + var(--st));left:calc(6px + var(--sl));right:calc(6px + var(--sr));display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
.group{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;align-items:center;pointer-events:auto}
button{border:1px solid #bda978;background:#184351f0;color:#f5e8c9;border-radius:7px;font:700 11px system-ui;min-height:35px;padding:6px 10px;touch-action:manipulation;cursor:pointer}
button.active{background:#e4c381;color:#18363e}
button:focus-visible{outline:2px solid #b3eee1;outline-offset:2px}
#footer{position:absolute;z-index:13;left:calc(6px + var(--sl));right:calc(6px + var(--sr));bottom:calc(5px + var(--sb));display:flex;flex-direction:column;align-items:center;gap:4px;pointer-events:none}
#footer>*{pointer-events:auto}
#message,#runtime{border:1px solid #649f94;border-radius:7px;background:#123542eb;max-width:97vw;text-align:center;padding:4px 8px;font-size:10px}
#runtime{font-size:9px}
#portrait{position:absolute;inset:0;display:none;z-index:30;background:#0d2d37;color:#f4e5c7;padding:35px;text-align:center;align-items:center;justify-content:center;font-size:19px}
@media(orientation:portrait) and (max-width:880px){#portrait{display:flex}}
@media(orientation:landscape) and (max-height:480px){
 #tools{top:calc(2px + var(--st));gap:2px}
 button{min-height:29px;padding:3px 6px;font-size:9px}
 #footer{bottom:calc(2px + var(--sb));gap:2px}
 #message{font-size:9px;padding:2px 5px}#runtime{display:none}
}
</style></head><body><main id="app">
<div id="stage" aria-label="Comparador Phaser P01, P02 A, P02 B y P03 del Equipo P"></div>
<div id="tools">
 <nav class="group" aria-label="Personaje">
  <button data-actor="warrior" class="active">Orco Guerrero</button>
  <button data-actor="hound">Perro de Caza</button>
  <button data-actor="infantry_recruit">Soldado Recluta</button>
  <button data-actor="sniper_operator">Operador Francotirador</button>
 </nav>
 <div class="group" aria-label="Animación">
  <button data-state="idle">Idle</button><button data-state="walk" class="active">Walk</button>
  <button data-state="attackWindup">Windup</button><button data-state="attack">Attack</button>
  <button data-state="hit">Hit</button><button data-state="blocked">Blocked</button>
  <button data-state="die">Die</button>
 </div>
 <div class="group">
  <button id="facing">Dirección: E</button><button id="pause">Ⅱ Pausar</button>
  <button id="scale">Escala: M01 1×</button><button id="zone">Zona HP/escudo: OFF</button>
 </div>
</div>
<footer id="footer">
 <div class="group">
  <button id="png">Exportar atlas P03</button>
  <button id="faces">Exportar hoja de estudio P03</button>
 </div>
 <div id="message" role="status">Iniciando vitrina P03 con Phaser/WebGL2…</div>
 <div id="runtime">Los controles son visuales. Sin daño, vida, economía, IA ni combate oficial.</div>
</footer>
<div id="portrait">↻ Gira el dispositivo a horizontal para comparar el arte y sus animaciones.</div>
</main>
<script src="../../../dependencias/phaser.min.js"></script>
<script type="module" src="./p03-gallery.mjs"></script>
</body></html>
