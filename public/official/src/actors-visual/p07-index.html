<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d393e"><title>Semantropic TD · P07 Continuidad C1-C / Phaser</title>
<style>
:root{color-scheme:dark;--t:env(safe-area-inset-top,0px);--b:env(safe-area-inset-bottom,0px);--l:env(safe-area-inset-left,0px);--r:env(safe-area-inset-right,0px)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{font:700 12px system-ui,sans-serif;background:#172d34;color:#f6e7c4}
#app{width:100vw;height:100dvh;position:relative;overflow:hidden}
#stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#stage canvas{max-width:100%;max-height:100%;touch-action:none;display:block}
#tools{position:absolute;z-index:12;top:calc(4px + var(--t));left:calc(4px + var(--l));right:calc(4px + var(--r));display:flex;flex-direction:column;gap:5px;align-items:center;pointer-events:none}
.group{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;pointer-events:auto}
button{border:1px solid #a5c1b6;background:#1a4750ed;color:#f4e6c7;border-radius:8px;min-height:35px;padding:5px 8px;font:700 11px system-ui;cursor:pointer;touch-action:manipulation}
button.active{background:#eac890;color:#1a343f}
button:focus-visible{outline:2px solid #9af9d7;outline-offset:2px}
#bottom{position:absolute;left:calc(5px + var(--l));right:calc(5px + var(--r));bottom:calc(3px + var(--b));z-index:12;display:flex;align-items:center;flex-direction:column;gap:3px;pointer-events:none}
#bottom>*{pointer-events:auto}
#message,#runtime{padding:3px 9px;border:1px solid #729b96;background:#112f3bdc;border-radius:7px;text-align:center;font-size:10px;max-width:97vw}
#runtime{font-size:9px}
#portrait{position:absolute;inset:0;z-index:30;background:#0c3037;display:none;align-items:center;justify-content:center;padding:25px;text-align:center;font-size:19px}
@media (max-width:850px) and (orientation:portrait){#portrait{display:flex}}
@media(max-height:460px) and (orientation:landscape){
 #tools{gap:2px;top:calc(1px + var(--t))}
 button{min-height:27px;padding:2px 5px;font-size:9px}
 #bottom{bottom:calc(1px + var(--b));gap:2px}
 #runtime{display:none}#message{font-size:8px;padding:2px}
}
</style></head><body><main id="app">
<div id="stage" aria-label="Comparativa artística real Phaser P04, P05 y P07"></div>
<div id="tools">
 <nav class="group">
  <button data-actor="warrior" class="active">Orco Guerrero</button>
  <button data-actor="hound">Perro de Caza</button>
  <button data-actor="infantry_recruit">Recluta P03</button>
  <button data-actor="sniper_operator">Operador P03 SIN RIFLE</button>
 </nav>
 <div class="group">
  <button data-state="idle">Idle</button><button data-state="walk" class="active">Walk</button>
  <button data-state="attackWindup">Prepare</button><button data-state="attack">Attack</button>
  <button data-state="hit">Hit</button><button data-state="blocked">Blocked</button>
  <button data-state="die">Salida</button>
 </div>
 <div class="group">
  <button id="pause">Ⅱ</button><button id="step">Siguiente cuadro</button>
  <button id="direction">Vista E</button><button id="background">Fondo neutral</button>
  <button id="scale">Escala world</button><button id="guides">Pivotes OFF</button>
  <button id="stress">24 actores OFF</button>
 </div>
</div>
<div id="bottom">
 <div class="group">
  <button id="film">Filmstrip 8 poses P07</button></div>
 <div id="message" role="status">Preparando galería con cuatro archivos PNG reales…</div>
 <div id="runtime">P03 → P06 → P07: mismos fotogramas y escala, pradera PROXY; sin combate core.</div>
</div>
<div id="portrait">↻ Gira el dispositivo en horizontal para evaluar el arte de los personajes.</div>
</main><script src="../../../dependencias/phaser.min.js"></script>
<script type="module" src="./p07-gallery.mjs"></script>
</body></html>
