<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SEMANTROPIC TD C1-D7 G1 · Menús contextuales · Mapa 01</title>
<style>
:root{color-scheme:dark;--cream:#f4e6c7;--gold:#e7cc8f;--ocean:#163b46}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;
background:#173941;color:var(--cream);font-family:system-ui,sans-serif}
[hidden]{display:none!important}
#app{width:100vw;height:100dvh;position:relative;overflow:hidden}
#stage{position:absolute;inset:0;overflow:hidden}#stage canvas{touch-action:manipulation}
#hud{z-index:4;position:absolute;left:max(5px,env(safe-area-inset-left));
top:max(4px,env(safe-area-inset-top));display:flex;gap:5px;align-items:flex-start;
max-width:min(76vw,760px);pointer-events:none}
#overview{background:#102f3ad9;border:1px solid #c9bc8a99;border-radius:9px;
padding:5px 8px;max-width:100%;box-shadow:0 3px 14px #0003}
#overview h1{margin:0;font-size:12px;line-height:1.15}
#overview p{margin:1px 0;font-size:11px;color:#d8e5d6;line-height:1.3}
#overview b{color:#fce2a2}
#record{font-size:10px}
#hudControls{position:absolute;z-index:5;top:max(4px,env(safe-area-inset-top));
right:max(5px,env(safe-area-inset-right));display:flex;align-items:center;gap:5px}
button{background:#174856ed;color:var(--cream);border:1px solid var(--gold);
font:700 12px system-ui;min-height:42px;border-radius:9px;padding:6px 10px;touch-action:manipulation}
button:disabled{opacity:.43;cursor:not-allowed}
button:focus-visible{outline:3px solid #fff2ad;outline-offset:2px}
#feedback{z-index:4;position:absolute;left:max(6px,env(safe-area-inset-left));
bottom:max(6px,env(safe-area-inset-bottom));max-width:min(57vw,440px);
background:#10353dcc;border:1px solid #d6c49799;border-radius:8px;
font-size:11px;line-height:1.3;padding:5px 8px;pointer-events:none}
#contextMenu{z-index:9;position:absolute;display:grid;gap:5px;width:208px;
max-height:calc(100dvh - 16px);overflow:auto;
background:#153c49f4;border:1px solid #e7d094;border-radius:12px;
box-shadow:0 10px 35px #071d27aa;padding:9px;pointer-events:auto;
overscroll-behavior:contain;touch-action:manipulation}
#contextMenu .heading{display:flex;justify-content:space-between;gap:5px;align-items:center;
font-size:12px;font-weight:800;color:#ffe5a1}
#contextMenu .heading button{padding:1px 7px;min-height:34px;font-size:16px}
#menuInfo{font-size:10px;color:#e0e9d9;min-height:13px}
#menuActions{display:grid;gap:5px}
#menuActions button{text-align:left;width:100%;min-height:44px;line-height:1.2;padding:6px 9px}
#menuActions button[disabled]{opacity:.4}
#menuReason{font-size:10px;color:#f4d9af;min-height:0}
#rallyHint{z-index:7;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
background:#10353be8;border:1px solid #e9ca91;border-radius:10px;padding:7px 12px;
text-align:center;font-size:12px;pointer-events:none}
#results[hidden]{display:none!important}
#results{z-index:12;position:absolute;inset:0;background:#102730b5;
display:flex;align-items:center;justify-content:center;padding:16px;
backdrop-filter:blur(3px)}
#results article{width:min(480px,95vw);max-height:85dvh;overflow:auto;text-align:center;
background:#173c47f7;border:2px solid #e7cc8f;border-radius:16px;padding:18px;
box-shadow:0 18px 60px #0008}
#resultTitle{margin:0;font-size:24px}#resultStars{font-size:36px;color:#fce2a2}
#resultDetail{font-size:13px}#resultSaved{display:block;font-size:11px;color:#dbe7d9;margin:12px}
#portrait{display:none;position:absolute;z-index:20;inset:0;align-items:center;justify-content:center;
background:#173c46;color:#ffefc2;text-align:center;font-size:19px;padding:24px}
@media(max-width:1050px) and (orientation:landscape){
#overview{padding:3px 5px;border-radius:6px}
#overview h1{font-size:10px}#overview p{font-size:10px;line-height:1.15}
#overview #record{display:none}
#hud{max-width:58vw}
#hudControls{gap:3px}
#hudControls button{min-height:42px;font-size:10px;padding:4px 7px}
#feedback{max-width:44vw;font-size:10px;bottom:max(3px,env(safe-area-inset-bottom));padding:3px 5px}
#contextMenu{padding:6px;gap:3px;border-radius:9px}
#menuActions button{min-height:43px;font-size:11px}
}
@media(max-width:950px) and (orientation:portrait){#portrait{display:flex}}
</style></head>
<body><main id="app">
<div id="stage"></div>
<header id="hud"><div id="overview">
<h1>SEMANTROPIC TD · C1-D7</h1>
<p>Oro <b id="coins">365</b> · Vidas <b id="lives">100</b> · Onda <b id="wave">0/5</b></p>
<p>Bajas <b id="kills">0</b> · Fugas <b id="leaks">0</b> · <b id="state">PREPARACIÓN</b></p>
<p id="record">Récord: sin completar</p><span id="render" hidden>WebGL2…</span>
</div></header>
<div id="hudControls"><button id="waveStart">Iniciar oleada</button><button id="pause">Pausar</button>
<button id="restart" aria-label="Reiniciar partida">↻</button></div>
<div id="feedback" role="status">Cargando Mapa 01…</div>
<nav id="contextMenu" hidden aria-label="Acciones de torre o plataforma">
<div class="heading"><span id="menuTitle">Plataforma</span>
<button id="menuClose" aria-label="Cerrar acciones">×</button></div>
<div id="menuInfo"></div><div id="menuActions"></div><div id="menuReason" role="status"></div>
</nav>
<div id="rallyHint" hidden>Selecciona un punto del camino para reunir al escuadrón.</div>
<section id="results" role="dialog" aria-modal="true" aria-labelledby="resultTitle" hidden>
<article><h2 id="resultTitle">Resultado</h2><div id="resultStars"></div>
<p id="resultDetail"></p><small id="resultSaved"></small>
<button id="resultRestart">Volver a jugar Mapa 01</button></article></section>
<div id="portrait">Gira el teléfono a horizontal para jugar.</div>
</main>
<script src="../../../dependencias/phaser.min.js"></script>
<script type="module" src="./scene.mjs"></script>
</body></html>
