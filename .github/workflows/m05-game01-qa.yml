name: M05 GAME-01 — 13 oleadas y Señor de la Niebla
on:
  pull_request:
    branches: [production/semantropic-td-live]
    paths:
      - 'public/official/src/core-c1d/m05-*.mjs'
      - 'public/official/src/c1d8-b2-playable/scene-m05.mjs'
      - 'public/official/src/c1d8-b2-playable/scene-m02.mjs'
      - 'public/official/src/maps-visual/m05/**'
      - 'public/official/src/actors-visual/m05/**'
      - 'public/official/src/live/index.html'
      - 'public/official/src/maps-visual/m02/map-picker.mjs'
      - 'public/official/src/mobile/viewport-panorama-r5.mjs'
      - 'tools/qa-m05-game01-*.mjs'
      - 'docs/blocks/m05-game01/**'
      - '.github/workflows/m05-game01-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canonical-combat-browser-realtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Arte congelado, paridad Canvas, campaña y jefe
        run: |
          node tools/qa-m05-game01-scope.mjs
          node tools/qa-m05-game01-core.mjs
          node tools/qa-m04-campaign.mjs
          node tools/qa-m03-campaign.mjs
          node tools/qa-c1d2-five-waves.mjs
      - name: Build y Chromium
        run: |
          npm install --package-lock=false --no-audit --no-fund
          npm run build
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.57.0
          npx playwright install --only-shell chromium
      - name: Input PC y móvil, campaña por pasos, jefe y resultados
        run: node tools/qa-m05-game01-browser.mjs
      - name: Partida completa por UI, reloj RAF sin acelerar
        run: node tools/qa-m05-game01-realtime.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: M05-GAME01-CANONICAL-BROWSER-REALTIME
          path: artifacts/m05-*/
          retention-days: 14
