name: M08 MAP ART — propuesta aislada
on:
  pull_request:
    branches: [production/semantropic-td-live]
    paths: ['public/official/src/maps-visual/m08/**', 'public/official/art/maps/m08/**', 'tools/qa-m08-art*.mjs', 'docs/blocks/m08-map-art-01/**', '.github/workflows/m08-art-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry-art-render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node tools/qa-m08-art.mjs
          node --check public/official/src/maps-visual/m08/cartoon01/plan.mjs
          node --check public/official/src/maps-visual/m08/cartoon01/world.mjs
          node --check public/official/src/maps-visual/m08/preview/preview.mjs
          npm install --package-lock=false --no-audit --no-fund
          npm run build
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --only-shell chromium
      - run: |
          python3 -m http.server 8188 --directory dist > /tmp/m08-http.log 2>&1 &
          node tools/qa-m08-art-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: M08-ART-OVERLAY-PC-MOVIL
          path: artifacts/m08-art/
