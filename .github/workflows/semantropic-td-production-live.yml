name: SEMANTROPIC TD — QA producción permanente R3-B1 M02 COMBATE AUTORITATIVO
on:
  push:
    branches: [production/semantropic-td-live]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  permanent-playable-release:
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bloqueo histórico de arte y pruebas de economía, mapas y personajes
        shell: bash
        run: |
          set -euo pipefail
          node tools/qa-c1d4r-source-lock.mjs
          node tools/qa-c1d5-navigation.mjs
          node tools/qa-c1d5-results.mjs
          node tools/qa-c1d8-b1-rally-core.mjs
          node tools/qa-c1d8-b3-motion.mjs
          node docs/art/towers/qa-t10-b2.mjs
          node docs/art/towers/qa-t10-premium.mjs
          node docs/art/towers/qa-t10-r1-hf2.mjs
          node docs/direccion-general/qa-u02-ab.mjs
          node docs/direccion-general/qa-u02-hf1-ornament.mjs
          node docs/direccion-general/qa-u03-c.mjs
          node docs/direccion-general/qa-u04-hd.mjs
          node docs/direccion-general/qa-u05-f3a-infantry-hd.mjs
          node docs/direccion-general/qa-u06-global-hd.mjs
          node docs/direccion-general/qa-u07-hd-gallery.mjs
          node tools/qa-r3-m02-canonical.mjs
          node docs/direccion-general/qa-r3a-m02-rework.mjs
          node docs/direccion-general/qa-r3b-m02-core.mjs
          node tools/qa-c1d7-menu.mjs
          node tools/qa-c1d7-actor-visual.mjs
          node docs/art/towers/qa-t09.mjs
          node public/official/src/actors-visual/p08/qa-p08.mjs
          node public/official/src/actors-visual/qa-p07.mjs
          node --check tools/qa-c1d8-b3-browser.mjs
          node --check tools/qa-c1d8-b2-sniper-browser.mjs
          node --check public/official/src/c1d8-b2-playable/scene.mjs
          node --check public/official/src/towers-visual/t10/sniper-muzzle-contract.mjs
          node --check public/official/src/towers-visual/t10/premium-runtime-muzzle.mjs
          node --check public/official/src/towers-visual/t10/p03-operator-rifle-muzzle.mjs
          node --check public/official/src/towers-visual/t10/sniper-operator-tracking.mjs
          node --check public/official/src/towers-visual/t10/p03-atlas-isolation.mjs
          node --check public/official/src/actors-visual/u04-ally-hd.mjs
          node --check tools/qa-u04-hd-browser.mjs
          node --check tools/qa-u05-infantry-hd-browser.mjs
          node --check tools/qa-u06-global-hd-browser.mjs
          node --check tools/qa-u07-hd-gallery-browser.mjs
          node --check tools/qa-r3a-m02-art-browser.mjs
          node --check public/official/src/maps-visual/m02/farmland-art.mjs
          node --check public/official/src/maps-visual/m02/rework-contract.mjs
          node --check public/official/src/core-c1d/m02-construction-economy.mjs
          node --check public/official/src/core-c1d/m02-infantry-nav.mjs
          node --check public/official/src/core-c1d/m02-combat-world.mjs
          node --check public/official/src/core-c1d/m02-infantry-combat-a2.mjs
          node --check public/official/src/core-c1d/m02-infantry-combat-a3.mjs
          node --check public/official/src/towers-visual/u06/hd-gallery-ui.mjs
          node --check public/official/src/towers-visual/u06/legacy-hd.mjs
          node --check tools/qa-u03-c-premium-browser.mjs
          node --check tools/qa-u02-ab-browser.mjs
          node --check tools/qa-t10-r1-sync-browser.mjs
          node --check tools/qa-t10-r1-hf2-rifle-abc-browser.mjs
          node --check public/official/src/core-c1d/m01-infantry-combat-a3.mjs
          node --check public/official/src/c1d8-b3-combat/motion.mjs
      - name: Compilar juego real Phaser 4.2.1
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build
      - name: Verificar URL única, archivos B3, Phaser, campaña
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e '
          import assert from "node:assert/strict";
          import {readFileSync,existsSync} from "node:fs";
          const root=readFileSync("dist/index.html","utf8");
          const shortcut=readFileSync("dist/play-m01/index.html","utf8");
          const live=readFileSync("dist/official/src/live/index.html","utf8");
          assert(root.includes("official/src/live/"),"Root must open canonical live path");
          assert(shortcut.includes("official/src/live/"),"Shortcut must open canonical path");
          assert(live.includes("../c1d8-b2-playable/scene.mjs?release=u07-hd-gallery-live-v1"),"Live must point to new T10 premium scene release");
          assert(live.includes("U07 GALERÍA HD"),"Live must display the new release identifier");
          assert(live.includes("../towers-visual/t09/menu.css"),"T09 radial stylesheet absent");
          for(const p of ["dist/official/src/c1d8-b2-playable/scene.mjs",
            "dist/official/src/towers-visual/t09/menu.css",
            "dist/official/src/towers-visual/t10/sniper-muzzle-contract.mjs",
            "dist/official/src/towers-visual/t10/premium-runtime-muzzle.mjs",
            "dist/official/src/towers-visual/t10/p03-operator-rifle-muzzle.mjs",
            "dist/official/src/towers-visual/t10/sniper-operator-tracking.mjs",
            "dist/official/src/towers-visual/t10/p03-atlas-isolation.mjs",
            "dist/official/src/actors-visual/u04-ally-hd.mjs",
            "dist/official/src/towers-visual/u06/legacy-hd.mjs",
            "dist/official/src/towers-visual/u06/hd-gallery-ui.mjs",
            "dist/official/src/maps-visual/m02/farmland-art.mjs",
            "dist/official/src/maps-visual/m02/rework-contract.mjs",
            "dist/official/src/core-c1d/m02-construction-economy.mjs",
            "dist/official/src/core-c1d/m02-infantry-nav.mjs",
            "dist/official/src/core-c1d/m02-combat-world.mjs",
            "dist/official/src/core-c1d/m02-infantry-combat-a2.mjs",
            "dist/official/src/core-c1d/m02-infantry-combat-a3.mjs",
            "dist/official/src/actors-visual/p08/p08-loader.mjs",
            "dist/official/data/maps.v5.json","dist/official/data/campaign140.v5.json",
            "dist/dependencias/phaser.min.js"])assert(existsSync(p),"Missing release asset "+p);
          console.log("PASS_U07_HD_GALLERY_LIVE_CANONICAL_ENTRY");
          '
      - name: Instalar Chromium WebGL2
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: R3-A Mapa 02 163 nodos, 8 pads, nueva identidad y rework 5 torres (sin habilitar gameplay)
        shell: bash
        env:
          SEMANTROPIC_PLAYTEST_PATH: /official/src/live/
        run: |
          set -euo pipefail
          node tools/qa-r3a-m02-art-browser.mjs 2>&1 | tee qa-r3a-m02-farmland.log
      - name: Validar atlas P03 aislado y proyectiles Premium C en WebGL2
        shell: bash
        env:
          SEMANTROPIC_PLAYTEST_PATH: /official/src/live/
        run: |
          set -euo pipefail
          node tools/qa-u03-c-premium-browser.mjs 2>&1 | tee qa-u03-c-live.log
      - name: Validar U04 HD Francotirador y Aliados 2x, geometría y WebGL2
        shell: bash
        env:
          SEMANTROPIC_PLAYTEST_PATH: /official/src/live/
        run: |
          set -euo pipefail
          node tools/qa-u04-hd-browser.mjs 2>&1 | tee qa-u04-hd-live.log
      - name: U05 Cuartel HD I/II – WebGL2 3 resoluciones, escala y soldados
        shell: bash
        env:
          SEMANTROPIC_PLAYTEST_PATH: /official/src/live/
        run: |
          set -euo pipefail
          node tools/qa-u05-infantry-hd-browser.mjs 2>&1 | tee qa-u05-infantry-hd-live.log
      - name: U06 Sniper 3x + Guardiana Bombardera Control HD previews en URL canónica
        shell: bash
        env:
          SEMANTROPIC_PLAYTEST_PATH: /official/src/live/
        run: |
          set -euo pipefail
          node tools/qa-u06-global-hd-browser.mjs 2>&1 | tee qa-u06-hd-live.log
      - name: U07 Galería HD interactiva dentro de LIVE + pausa y regresión móvil
        shell: bash
        env:
          SEMANTROPIC_PLAYTEST_PATH: /official/src/live/
        run: |
          set -euo pipefail
          node tools/qa-u07-hd-gallery-browser.mjs 2>&1 | tee qa-u07-hd-gallery-live.log
      - name: Juego completo B3 sobre LIVE 3 resoluciones + victoria/derrota real
        shell: bash
        env:
          SEMANTROPIC_PLAYTEST_PATH: /official/src/live/
        run: |
          set -euo pipefail
          node tools/qa-c1d8-b3-browser.mjs 2>&1 | tee qa-c1d8-b3-live-url.log
      - name: Validar bala real nivel I/II desde rifle T10 en LIVE
        shell: bash
        env:
          SEMANTROPIC_PLAYTEST_PATH: /official/src/live/
        run: |
          set -euo pipefail
          node tools/qa-c1d8-b2-sniper-browser.mjs 2>&1 | tee qa-c1d8-b2-live-url.log
      - name: Validar sincronización R1 e impacto real en 12 casos
        shell: bash
        run: |
          set -euo pipefail
          node tools/qa-t10-r1-sync-browser.mjs 2>&1 | tee qa-t10-r1-sync-live.log
      - name: Validar rifle visible P03 en ambos niveles y 3 resoluciones
        shell: bash
        run: |
          set -euo pipefail
          node tools/qa-t10-r1-hf2-rifle-abc-browser.mjs 2>&1 | tee qa-t10-r1-hf2-live.log
      - name: Validar orientación y plataforma U02 A+B en Chromium real
        shell: bash
        env:
          SEMANTROPIC_PLAYTEST_PATH: /official/src/live/
        run: |
          set -euo pipefail
          node tools/qa-u02-ab-browser.mjs 2>&1 | tee qa-u02-ab-live.log
      - name: Conservar screenshots y logs de release
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SEMANTROPIC_TD_T10_R1_HF2_URL_OFICIAL_QA_REAL
          path: |
            artifacts/c1d8-b3-browser/
            artifacts/c1d8-b2-browser/
            artifacts/t10-r1-sync-browser/
            artifacts/t10-r1-hf2-rifle-abc-browser/
            artifacts/u02-ab-browser/
            artifacts/u03-c-premium-browser/
            artifacts/u04-hd-browser/
            artifacts/u05-infantry-hd-browser/
            artifacts/u06-global-hd-browser/
            artifacts/u07-hd-gallery-browser/
            artifacts/r3a-m02-farmland-browser/
            qa-c1d8-b3-live-url.log
            qa-c1d8-b2-live-url.log
            qa-t10-r1-sync-live.log
            qa-t10-r1-hf2-live.log
            qa-u02-ab-live.log
            qa-u03-c-live.log
            qa-u04-hd-live.log
            qa-u05-infantry-hd-live.log
            qa-u06-hd-live.log
            qa-u07-hd-gallery-live.log
            qa-r3a-m02-farmland.log
          if-no-files-found: warn
