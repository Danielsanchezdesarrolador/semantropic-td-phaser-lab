name: M02 Cartoon03 — QA proporcional
on:
  pull_request:
    branches: [production/semantropic-td-live]
    paths:
      - 'public/official/src/maps-visual/m02/**'
      - 'public/official/art/maps/m02/**'
      - 'tools/qa-m02-cartoon03-*.mjs'
      - 'docs/blocks/m02-cartoon03/**'
      - 'tools/qa-b02-map-art.mjs'
      - 'tools/qa-r6-m02-premium-browser.mjs'
      - 'docs/direccion-general/qa-r6-m02-visual.mjs'
      - 'docs/blocks/b02/**'
      - '.github/workflows/b02-map-art-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  art-contract-build-render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Contrato artístico, geometría y runtime protegido
        run: |
          node --check public/official/src/maps-visual/m02/b02/pictoric-farmland.mjs
          node --check public/official/src/maps-visual/m02/cartoon03/farmland-world.mjs
          node --check public/official/src/maps-visual/m02/cartoon03/atlas.mjs
          node tools/qa-b02-map-art.mjs
          node tools/qa-m02-cartoon03-art.mjs
          node docs/direccion-general/qa-r6-m02-visual.mjs
          node docs/direccion-general/qa-r3c-m02-scene.mjs
      - name: Build Phaser y Chromium
        run: |
          npm install --package-lock=false --no-audit --no-fund
          npm run build
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.57.0
          npx playwright install --only-shell chromium
      - name: Render PC y móvil, pads, movimiento, combate y smoke M01/M03
        run: node tools/qa-r6-m02-premium-browser.mjs
      - name: Capturas y resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: M02-CARTOON03-PC-MOVIL
          path: artifacts/m02-cartoon03/
          retention-days: 14
